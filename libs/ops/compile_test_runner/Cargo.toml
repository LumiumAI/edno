[package]
name = "edno_ops_compile_test_runner"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Compile-test runner for edno_ops"

[lib]
path = "lib.rs"

[dev-dependencies]
bytes.workspace = true
# edno_core's default enables no JS engine backend (the edno_v8 facade requires
# exactly one of `v8`/`quickjs`); trybuild compiles the op2/webidl test cases as
# their own crates against these deps, so select v8 or they fail to build.
edno_core = { workspace = true, features = ["v8"] }
deno_error.workspace = true
edno_ops.workspace = true
serde.workspace = true
trybuild = "1.0.104"
