[package]
name = "edno_cli_parser"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-cost CLI argument parser for the Edno CLI"

[lib]
path = "src/lib.rs"

[dependencies]
edno_bundle_runtime.workspace = true
edno_config = { workspace = true, features = ["workspace"] }
edno_core.workspace = true
edno_lib.workspace = true
edno_npm_installer.workspace = true
edno_permissions.workspace = true
edno_runtime.workspace = true
deno_semver.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
sys_traits = { workspace = true, features = ["real"] }

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true

[[bench]]
name = "parse"
harness = false
