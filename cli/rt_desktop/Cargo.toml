[package]
name = "ednort_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides libdenort shared library for laufey desktop apps"

[lib]
name = "ednort"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["edno_core/quickjs", "ednort/quickjs", "v8/quickjs"]
v8 = ["edno_core/v8", "ednort/v8", "v8/v8"]

[build-dependencies]
edno_runtime.workspace = true
edno_core.workspace = true
v8.workspace = true

[dependencies]
edno_core.workspace = true
deno_error.workspace = true
edno_lib.workspace = true
edno_runtime.workspace = true
edno_snapshots.workspace = true
deno_terminal.workspace = true
ednort = { path = "../rt", default-features = false }
laufey = "0.7.0"
libsui.workspace = true

log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
