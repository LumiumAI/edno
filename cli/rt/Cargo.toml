[package]
name = "ednort"
version = "2.9.7"
authors.workspace = true
default-run = "ednort"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides the ednort executable"

[[bin]]
name = "ednort"
path = "main.rs"
doc = false

[lib]
path = "./lib.rs"

[[test]]
name = "integration"
path = "integration_tests_runner.rs"
harness = false

[features]
default = ["v8"]
quickjs = ["edno_core/quickjs", "v8/quickjs"]
v8 = ["edno_core/v8", "v8/v8"]

[build-dependencies]
edno_runtime.workspace = true
edno_core.workspace = true
v8.workspace = true

[dependencies]
async-trait.workspace = true
bincode.workspace = true
deno_ast = { workspace = true, features = ["cjs"] }
edno_cache_dir = { workspace = true, features = ["sync"] }
edno_config = { workspace = true, features = ["sync", "workspace"] }
edno_core.workspace = true
deno_error.workspace = true
edno_lib.workspace = true
deno_media_type = { workspace = true, features = ["data_url", "decoding"] }
edno_node.workspace = true
edno_npm.workspace = true
edno_npmrc.workspace = true
edno_package_json = { workspace = true, features = ["sync"] }
deno_path_util.workspace = true
edno_resolver = { workspace = true, features = ["sync"] }
edno_runtime.workspace = true
deno_semver.workspace = true
edno_snapshots.workspace = true
deno_terminal.workspace = true
import_map.workspace = true
indexmap.workspace = true
jsonc-parser = { workspace = true }
libsui.workspace = true
log = { workspace = true, features = ["serde"] }
node_resolver.workspace = true
notify.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sys_traits = { workspace = true, features = ["getrandom", "filetime", "libc", "real", "strip_unc", "winapi"] }
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
v8.workspace = true

[target.'cfg(windows)'.dependencies]
junction.workspace = true
memmap2.workspace = true
edno_subprocess_windows.workspace = true

[dev-dependencies]
sys_traits = { workspace = true, features = ["memory"] }
test_util.workspace = true
