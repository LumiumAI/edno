[package]
name = "edno_process"
version = "0.74.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Subprocess APIs for Edno"

[lib]
path = "lib.rs"

[dependencies]
edno_core.workspace = true
deno_error.workspace = true
edno_fs.workspace = true
edno_io.workspace = true
edno_os.workspace = true
deno_path_util.workspace = true
edno_permissions.workspace = true
edno_signals.workspace = true
edno_subprocess_windows.workspace = true
libc.workspace = true
log.workspace = true
memchr.workspace = true
rand.workspace = true
serde.workspace = true
sys_traits = { workspace = true, features = ["real", "winapi", "libc"] }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
