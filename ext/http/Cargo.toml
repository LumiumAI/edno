[package]
name = "edno_http"
version = "0.257.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "HTTP server implementation for Edno"

[features]
default = ["default_property_extractor"]
"__http_tracing" = []
default_property_extractor = []

[lib]
path = "lib.rs"

[[bench]]
name = "compressible"
harness = false

[dependencies]
async-compression = { workspace = true, features = ["tokio", "brotli", "gzip"] }
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
edno_core.workspace = true
deno_error.workspace = true
edno_http_h1.workspace = true
edno_net.workspace = true
edno_telemetry.workspace = true
edno_websocket.workspace = true
flate2.workspace = true
http.workspace = true
http-body-util = { workspace = true, features = ["channel"] }
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
itertools.workspace = true
log.workspace = true
mime.workspace = true
once_cell.workspace = true
percent-encoding.workspace = true
phf.workspace = true
pin-project.workspace = true
scopeguard.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
tokio-vsock.workspace = true

[dev-dependencies]
bencher.workspace = true
http-body-util.workspace = true
rand.workspace = true
