[package]
name = "edno_net"
version = "0.251.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Networking for Edno"

[lib]
path = "lib.rs"

[dependencies]
edno_core.workspace = true
deno_error.workspace = true
edno_features.workspace = true
edno_permissions.workspace = true
edno_signals.workspace = true
edno_tls.workspace = true
deno_tunnel.workspace = true
hickory-proto.workspace = true
hickory-resolver.workspace = true
libc.workspace = true
log.workspace = true
pin-project.workspace = true
quinn = { workspace = true, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls-tokio-stream.workspace = true
serde.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
web-transport-proto.workspace = true
x509-parser.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos"))'.dependencies]
tokio-vsock.workspace = true

[dev-dependencies]
sys_traits = { workspace = true, features = ["real", "libc"] }
